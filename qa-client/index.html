<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealWorld QA client</title>
<style>body{font:16px system-ui;max-width:850px;margin:35px auto;padding:0 20px;color:#152438;background:#f3f6fa}section{background:white;padding:20px;margin:16px 0;border-radius:12px}input,textarea{display:block;width:95%;padding:10px;margin:8px 0;border:1px solid #aebbc9;border-radius:6px}button{padding:10px;margin:5px;background:#174b75;color:white;border:0;border-radius:5px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}#status{font-weight:bold}</style>
<h1>RealWorld QA client</h1><p>A small test client for the pinned upstream API. Run the backend on port 3000. Test data stays in your local demo database.</p><p id="status" role="status">Logged out</p>
<section><h2>Account</h2><label>Username<input id="username" value="mukul-qa"></label><label>Email<input id="email" type="email" value="mukul-qa@example.test"></label><label>Password<input id="password" type="password" value="LocalTest123!"></label><button id="signup">Sign up</button><button id="login">Log in</button><button id="logout">Log out</button><button id="me">Check session</button></section>
<section><h2>Article</h2><label>Title<input id="title" value="My QA test"></label><label>Description<input id="description" value="RealWorld assignment QA"></label><label>Body<textarea id="body">Original article body</textarea></label><label>Tags (comma separated)<input id="tags" value="python,qa"></label><label>Article slug<input id="slug"></label><button id="create">Create</button><button id="edit">Edit body only</button><button id="read">Read article</button><button id="delete">Delete</button></section>
<section><h2>Profile</h2><label>Bio<input id="bio" value="Temporary QA biography"></label><button id="saveBio">Save bio</button><button id="clearBio">Clear bio</button></section><section><h2>Response</h2><pre id="result" aria-live="polite">Use the buttons above.</pre></section>
<script>
let token='';const el=id=>document.getElementById(id);const value=id=>el(id).value;
async function api(method,path,data){try{const r=await fetch('http://localhost:3000/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Token '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body={raw:text}}const display=JSON.parse(JSON.stringify(body));if(display.user)delete display.user.token;el('result').textContent=r.status+'\n'+JSON.stringify(display,null,2);return body}catch(e){el('result').textContent='Connection failed: '+e.message;return {}}}
function account(){return {email:value('email'),password:value('password'),username:value('username')}}
function remember(d){if(d.user?.token){token=d.user.token;el('status').textContent='Logged in as '+d.user.username}}
el('signup').onclick=async()=>remember(await api('POST','/users',{user:account()}));el('login').onclick=async()=>remember(await api('POST','/users/login',{user:account()}));el('logout').onclick=()=>{token='';el('status').textContent='Logged out';el('result').textContent='Local session token removed. Check session should return 401.'};el('me').onclick=()=>api('GET','/user');el('create').onclick=async()=>{const d=await api('POST','/articles',{article:{title:value('title'),description:value('description'),body:value('body'),tagList:value('tags').split(',').map(s=>s.trim()).filter(Boolean)}});if(d.article)el('slug').value=d.article.slug};const path=()=>'/articles/'+encodeURIComponent(value('slug'));el('edit').onclick=()=>api('PUT',path(),{article:{body:value('body')}});el('read').onclick=()=>api('GET',path());el('delete').onclick=()=>api('DELETE',path());el('saveBio').onclick=()=>api('PUT','/user',{user:{bio:value('bio')}});el('clearBio').onclick=()=>api('PUT','/user',{user:{bio:''}});
</script></html>
